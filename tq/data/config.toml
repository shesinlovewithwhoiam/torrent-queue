# See the README ("Configuration") for what each setting does.

[qbit]
host = "localhost"
port = 8080
username = "admin"
password = "adminadmin"

category = "tq"
# sequential = false

save_path = "./tq_data/torrents"
# container_save_path = "/downloads"


[data]
db_path = "./tq_data/queue.db"
log_dir = "./tq_data/logs"

[management]
max_active = 3
# inspect = true

[management.slow_cls]
slow_threshold = 0.5
min_time = 300
unslow_threshold = 1.0

[management.dead_cls]
timeout = 900
# metadata_timeout = 300

